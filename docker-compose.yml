services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bajatelo_backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DEMO_MAX_DURATION=60
      - DEMO_DOWNLOAD_COOLDOWN_MINUTES=10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bajatelo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
